databases:
  # Render-managed PostgreSQL
  - name: taskboard-postgres
    databaseName: taskboard
    user: taskboard
    plan: free

services:
  # Redis
  - type: redis
    name: taskboard-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # Backend API
  - type: web
    name: taskboard-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: taskboard-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: taskboard-postgres
          property: port
      - key: DB_USER
        fromDatabase:
          name: taskboard-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: taskboard-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: taskboard-postgres
          property: database
      - key: DB_SSLMODE
        value: require
      - key: REDIS_HOST
        fromService:
          name: taskboard-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: taskboard-redis
          type: redis
          property: port
      # Only requests from the deployed frontend are allowed (CORS + WebSocket origin)
      - key: CORS_ORIGIN
        value: https://rahultaskboard.onrender.com
    healthCheckPath: /api/v1/health

  # Frontend (nginx serves the SPA and proxies /api to the backend)
  - type: web
    name: taskboard-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile.prod
    dockerContext: ./frontend
    plan: free
    healthCheckPath: /health
    envVars:
      # Public URL of the taskboard-backend service, e.g.
      # https://taskboard-backend-xxxx.onrender.com (set in the Render dashboard)
      - key: BACKEND_URL
        sync: false
